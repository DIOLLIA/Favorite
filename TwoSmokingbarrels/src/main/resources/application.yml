server:
  port: 8081

app:
  movies:
    imageBaseUrl: "http://localhost:8089"

logging:
  level:
    root: info

spring:
  application:
    name: TwoSmokingBarrels
  datasource:
    url: jdbc:postgresql://localhost:5432/my_app_db
    username: fstck_user
    password: fstck_secret
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:sql/migration

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
